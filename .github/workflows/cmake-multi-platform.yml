name: Cross-Platform Compilation

on:
  push:
    branches: [ "develop", "release" ]
  pull_request:
    branches: [ "develop", "release", "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      run: ctest --test-dir ${{ steps.strings.outputs.build-output-dir }} --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Configure MSVC standard preprocessor
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ github.workspace }}/build-standard
        -DCMAKE_CXX_COMPILER=cl
        -DCMAKE_CXX_FLAGS_INIT="/Zc:preprocessor /DGMP_MAX_SUPPORTED_FIELDS=16"
        -DBUILD_TESTS=ON
        -S ${{ github.workspace }}

    - name: Build with MSVC standard preprocessor
      if: runner.os == 'Windows'
      run: cmake --build ${{ github.workspace }}/build-standard --config ${{ matrix.build_type }}

    - name: Test with MSVC standard preprocessor
      if: runner.os == 'Windows'
      run: ctest --test-dir ${{ github.workspace }}/build-standard --build-config ${{ matrix.build_type }} --output-on-failure
